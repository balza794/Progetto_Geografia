<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>GeoChalleng</title>
    <link rel="stylesheet" href="Progetto_geografia_MB/style.css">
</head>
<body>

    <style>
        body {
            zoom: 155%;
        }
    </style>

    <h1>🌍 GeoChalleng</h1>

    <img src="Progetto_geografia_MB/img/Cartina1.jpg" alt="Cartina">

    <div id="setup">
        <label>Numero di turni:</label>
        <input type="number" id="turniInput" min="1" max="20" value="5">
        <button onclick="startGame()">Inizia</button>
    </div>

    <div id="quiz" class="hidden">
        <p id="turno"></p>
        <p id="domanda"></p>
        <img id="immagineCarta" class="hidden">
        <input type="text" id="rispostaInput">
        <button id="rispondiBtn" onclick="rispondi()">Rispondi</button>
        <button id="avantiBtn" onclick="prossimaDomanda()" class="hidden">Avanti ➡️</button>
        <p id="feedback"></p>
    </div>

    <p id="punteggio"></p>

    <script src="Progetto_geografia_MB/script.js" defer></script>
</body>
</html>
